<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Jev · 文本判断</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#e4ecf3;background:#0d131b;--panel:#151e29;--border:#344354;--muted:#a6b6c8;--accent:#74e0c3}
*{box-sizing:border-box}body{margin:0}main{max-width:860px;margin:48px auto;padding:0 22px}header{margin-bottom:28px}.badge{font-size:12px;letter-spacing:2px;color:var(--accent)}h1{font-size:34px;margin:12px 0}h2{font-size:18px;margin:0 0 20px}p{line-height:1.7;color:var(--muted)}section,details{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;margin:18px 0}summary{cursor:pointer;font-weight:600}summary span{display:inline-block;font-size:13px;font-weight:400;color:var(--muted);margin-left:10px}label{display:block;font-weight:600;margin:0 0 9px}fieldset{border:0;margin:0;padding:0;min-width:0}legend{font-weight:600;padding:0;margin-bottom:10px}textarea,input{width:100%;border:1px solid #45566b;border-radius:9px;padding:12px;font:inherit;background:#0d1621;color:inherit}textarea{min-height:155px;resize:vertical;line-height:1.6}input{margin-bottom:16px}input::placeholder,textarea::placeholder{color:#8798ad}textarea:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.field{margin-top:22px}button{border:0;border-radius:9px;background:var(--accent);color:#08291f;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer}button:hover{filter:brightness(1.08)}button:disabled{opacity:.5;cursor:default}.secondary{background:#263648;color:#dce7f3}.actions{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:13px}.hint{margin:0 0 16px;font-size:13px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.mode{position:relative;cursor:pointer;margin:0}.mode input{position:absolute;opacity:0;width:1px;height:1px;margin:0}.mode span{display:block;padding:13px 8px;border:1px solid #45566b;border-radius:9px;background:#111b27;text-align:center;font-size:14px}.mode input:checked+span{color:var(--accent);background:#18392f;border-color:var(--accent)}.mode input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}fieldset:disabled{opacity:.7}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}.number{font-size:34px;font-weight:700;color:var(--accent);overflow-wrap:anywhere}.metric-label{color:var(--muted);font-size:13px;margin-bottom:8px}.distribution-row{margin:18px 0}.distribution-label{display:flex;justify-content:space-between;gap:16px;font-size:14px}.distribution-label span:first-child{overflow-wrap:anywhere;min-width:0}.distribution-label span:last-child{white-space:nowrap;color:var(--accent);font-variant-numeric:tabular-nums}.bar{height:8px;background:#2c3b4d;border-radius:10px;margin-top:9px;overflow:hidden}.fill{height:100%;background:var(--accent)}#message{min-height:24px;margin-top:14px;color:var(--muted);white-space:pre-wrap}#message.error{color:#ff9ba9}#resultNote{margin-bottom:0}[hidden]{display:none!important}@media(max-width:540px){main{margin-top:28px;padding:0 16px}h1{font-size:27px}section,details{padding:18px}.number{font-size:27px}.mode span{font-size:12px;padding:12px 4px}.modes{gap:6px}}
</style>
</head>
<body><main>
<header><div class="badge">TYPESAFE / JEV</div><h1>一段文本，三种判断方式。</h1><p>判断是否成立、选择合适选项，或沿着你定义的等级评分。</p></header>
<details id="settings"><summary>API Key 设置 <span id="keyStatus">正在检查…</span></summary>
<p class="small">保存一次，重启后仍可使用。密钥以明文保存在本机用户目录，WSL 下仅当前用户可读写；不会保存在浏览器中。</p>
<form id="keyForm"><label for="key">TypeSafe API Key</label><input id="key" type="password" autocomplete="off" placeholder="输入 API Key 以保存或更换" required><div class="actions"><button id="save" type="submit">保存 Key</button><button id="delete" type="button" class="secondary">删除已保存 Key</button></div></form>
</details>
<section><form id="askForm"><fieldset id="taskFields">
<fieldset><legend>判断类型</legend><div class="modes">
<label class="mode"><input type="radio" name="kind" value="noul" checked><span>Noul · 是非</span></label>
<label class="mode"><input type="radio" name="kind" value="choice"><span>Choice · 选项</span></label>
<label class="mode"><input type="radio" name="kind" value="score"><span>Score · 评分</span></label>
</div></fieldset>
<p id="modeHint" class="hint"></p>
<label for="text">待判断文本</label><textarea id="text" placeholder="输入需要判断的文本，支持多行。" required></textarea>
<label class="field" for="question" id="questionLabel">是非问题</label><input id="question" required>
<div id="criteriaField" hidden><label for="criteria" id="criteriaLabel"></label><p id="criteriaHint" class="hint"></p><textarea id="criteria" disabled></textarea></div>
<div class="actions field"><button id="ask" type="submit">开始判断</button><button id="example" type="button" class="secondary">填入示例</button></div>
</fieldset></form><div id="message" role="status" aria-live="polite"></div></section>
<section id="result" hidden aria-live="polite"><h2 id="resultTitle">判断结果</h2><div id="metrics" class="metrics"></div><div id="distribution"></div><p id="resultNote" class="small"></p></section>
</main>
<script nonce="__TOKEN__">
const $ = id => document.getElementById(id);
const token = '__TOKEN__';
const modes = {
  noul: {
    label: 'Noul · 是非判断', hint: '回答为“是”的概率，适合判断一个条件是否成立。', questionLabel: '是非问题',
    placeholder: '例如：这段文本是否要求退款？',
    text: '我想取消订单，请把钱退给我。', question: '这段文本是否要求退款？', criteria: ''
  },
  choice: {
    label: 'Choice · 选项判断', hint: '从给定选项中选择一个，并显示所有选项的概率。', questionLabel: '选项判断问题',
    placeholder: '例如：这条消息应该交给哪个团队处理？', criteriaLabel: '候选选项（每行一个）',
    criteriaHint: '填写 2–255 个不同选项。可写“选项 | 说明”；只有选项名也可以。',
    text: '我的订单已经取消了，但退款一周还没到账，请帮我查一下。', question: '这条消息应该交给哪个团队处理？',
    criteria: '账务 | 付款、退款、发票问题\n物流 | 配送进度、包裹丢失\n技术 | 网站或软件故障\n其他 | 不属于上述团队的问题'
  },
  score: {
    label: 'Score · 分级评分', hint: '按照从低到高排列的等级评分，分数可以落在两个等级之间。', questionLabel: '评分问题',
    placeholder: '例如：这份故障报告描述的问题有多严重？', criteriaLabel: '评分等级（从低到高，每行一个）',
    criteriaHint: '填写 2–10 个具体等级，自动从 0 编号。描述每级的实际含义，不要只填写数字。',
    text: '导出 PDF 时程序会报错，但导出 CSV 正常，我可以先用 CSV 完成工作。', question: '这份故障报告描述的问题有多严重？',
    criteria: '仅外观问题，不影响任何功能\n部分功能受损，但存在可用的替代方法\n核心功能完全不可用，且没有替代方法'
  }
};
let kind = 'noul';
const drafts = {noul: {question: '', criteria: ''}, choice: {question: '', criteria: ''}, score: {question: '', criteria: ''}};
function message(text, error = false) { $('message').textContent = text; $('message').className = error ? 'error' : ''; }
async function api(path, data) {
  const response = await fetch(path, data === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Jev-Token': token}, body: JSON.stringify(data)});
  const value = await response.json();
  if (!response.ok) throw new Error(value.error || '请求失败');
  return value;
}
async function status() {
  const value = await api('/api/status');
  $('keyStatus').textContent = value.saved ? '已保存，可直接使用' : value.ready ? '使用环境变量中的 Key' : '尚未设置';
  $('delete').disabled = !value.saved;
  if (!value.ready) $('settings').open = true;
}
function setMode(next) {
  drafts[kind] = {question: $('question').value, criteria: $('criteria').value};
  kind = next;
  const mode = modes[kind];
  $('modeHint').textContent = mode.hint;
  $('questionLabel').textContent = mode.questionLabel;
  $('question').placeholder = mode.placeholder;
  $('question').value = drafts[kind].question;
  $('criteriaField').hidden = kind === 'noul';
  $('criteria').disabled = kind === 'noul';
  $('criteria').required = kind !== 'noul';
  $('criteriaLabel').textContent = mode.criteriaLabel || '';
  $('criteriaHint').textContent = mode.criteriaHint || '';
  $('criteria').placeholder = mode.criteria;
  $('criteria').value = drafts[kind].criteria;
  $('result').hidden = true;
  message('');
}
function parseCriteria() {
  if (kind === 'noul') return undefined;
  const lines = $('criteria').value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  if (kind === 'score') {
    if (lines.length < 2 || lines.length > 10) throw new Error('Score 需要 2–10 个等级。');
    if (new Set(lines).size !== lines.length) throw new Error('等级说明不能重复。');
    return lines;
  }
  if (lines.length < 2 || lines.length > 255) throw new Error('Choice 需要 2–255 个选项。');
  const options = Object.create(null);
  for (const line of lines) {
    const split = line.indexOf('|');
    const name = (split < 0 ? line : line.slice(0, split)).trim();
    const description = split < 0 ? null : line.slice(split + 1).trim() || null;
    if (!name || Object.hasOwn(options, name)) throw new Error('选项名称不能为空或重复。');
    options[name] = description;
  }
  return options;
}
const percent = value => (value * 100).toFixed(2) + '%';
function metric(label, value, id) {
  const box = document.createElement('div');
  const title = document.createElement('div'); title.className = 'metric-label'; title.textContent = label;
  const number = document.createElement('div'); number.className = 'number'; number.textContent = value;
  if (id) number.id = id;
  box.append(title, number); $('metrics').append(box);
}
function probabilityRow(label, probability) {
  const row = document.createElement('div'); row.className = 'distribution-row';
  const heading = document.createElement('div'); heading.className = 'distribution-label';
  const name = document.createElement('span'); name.textContent = label;
  const value = document.createElement('span'); value.textContent = percent(probability);
  heading.append(name, value);
  const bar = document.createElement('div'); bar.className = 'bar';
  const fill = document.createElement('div'); fill.className = 'fill'; fill.style.width = percent(probability);
  bar.append(fill); row.append(heading, bar); $('distribution').append(row);
}
function renderResult(value, submittedKind) {
  $('metrics').replaceChildren(); $('distribution').replaceChildren();
  $('resultTitle').textContent = modes[submittedKind].label + '结果';
  if (submittedKind === 'noul') {
    metric('是的概率', percent(value.yes), 'yes'); metric('否的概率', percent(value.no), 'no');
    probabilityRow('是', value.yes); probabilityRow('否', value.no);
    $('resultNote').textContent = '接近 50% 表示“是”和“否”的概率接近。Noul 没有单独的置信度字段。';
  } else {
    if (submittedKind === 'choice') {
      metric('选中选项', value.choice, 'chosen');
      $('resultNote').textContent = '每个选项的概率表示它被选中的可能性。置信度由概率分布计算，和选中选项的概率是不同指标。';
    } else {
      const max = Object.keys(value.legend).length - 1;
      metric('加权分数 · 量程 0–' + max, value.score.toFixed(2), 'scoreValue');
      $('resultNote').textContent = '分数是各等级编号的概率加权平均，量程为 0–' + max + '，可以落在等级之间。置信度反映概率分布的集中程度。';
    }
    metric('置信度', percent(value.confidence), 'confidence');
    for (const [name, probability] of Object.entries(value.probabilities)) {
      probabilityRow(submittedKind === 'score' ? name + ' · ' + value.legend[name] : name, probability);
    }
  }
  $('result').hidden = false;
}
$('keyForm').addEventListener('submit', async event => {
  event.preventDefault(); $('save').disabled = true;
  try { await api('/api/key', {key: $('key').value}); $('key').value = ''; await status(); $('settings').open = false; message('Key 已保存。可以开始判断。'); }
  catch (error) { message(error.message, true); } finally { $('save').disabled = false; }
});
$('delete').addEventListener('click', async () => {
  try { await api('/api/key/delete', {}); $('key').value = ''; await status(); message('已删除保存的 Key；若已设置环境变量，将继续使用环境变量。'); }
  catch (error) { message(error.message, true); }
});
document.querySelectorAll('input[name="kind"]').forEach(input => input.addEventListener('change', () => setMode(input.value)));
$('askForm').addEventListener('input', () => { $('result').hidden = true; message(''); });
$('example').addEventListener('click', () => {
  const mode = modes[kind]; $('text').value = mode.text; $('question').value = mode.question; $('criteria').value = mode.criteria;
  $('result').hidden = true; message('已填入 ' + mode.label + '示例，点击“开始判断”。');
});
$('askForm').addEventListener('submit', async event => {
  event.preventDefault(); $('result').hidden = true;
  let criteria;
  try { criteria = parseCriteria(); } catch (error) { message(error.message, true); return; }
  const submittedKind = kind;
  const payload = {text: $('text').value, question: $('question').value, type: kind, criteria};
  $('taskFields').disabled = true; $('ask').textContent = '正在判断…'; message('正在调用 Jev…');
  try { const value = await api('/api/ask', payload); renderResult(value, submittedKind); message('判断完成。'); }
  catch (error) { message(error.message, true); }
  finally { $('taskFields').disabled = false; $('ask').textContent = '开始判断'; }
});
setMode('noul');
status().catch(error => message(error.message, true));
</script></body></html>
